# IP Blocking Configuration
#
# This file configures IP addresses that should be blocked from accessing the application.
# Both individual IP addresses and CIDR notation (network ranges) are supported.
#
# Configuration examples:
# production:
#   blocked_ips:
#     - 192.168.1.100     # Block a single IP address
#     - 10.0.0.0/24       # Block a range of IPs (10.0.0.0 - 10.0.0.255)
#     - 172.16.10.0/27    # Block a range of IPs (172.16.10.0 - 172.16.10.31)
#
# Note: This configuration must be a valid YAML file.
# Use 2 spaces instead of tabs for indentation.

# Default settings applied to all environments
default:
  blocked_ips: []

